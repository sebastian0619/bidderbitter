version: '3.8'

services:
  backend:
    image: ghcr.io/sebastian0619/bidderbitter/backend:latest
    ports:
      - "8000:8000"
    volumes:
      - ./data/uploads:/app/uploads
      - ./data/bidtool.db:/app/bidtool.db
    restart: unless-stopped

  frontend:
    image: ghcr.io/sebastian0619/bidderbitter/frontend:latest
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
